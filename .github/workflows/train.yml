name: train

on:
  schedule:
    # Domingos 06:00 UTC (~02:00 Venezuela): reentrena con la semana completa
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      horizon_min:
        description: "Horizonte de predicción en minutos"
        default: "15"
      threshold:
        description: "Umbral % para clase lateral"
        default: "0.25"

concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      - name: Entrenar
        run: |
          python train.py \
            --horizon-min "${{ github.event.inputs.horizon_min || '15' }}" \
            --threshold  "${{ github.event.inputs.threshold  || '0.25' }}"

      - name: Commit del modelo
        run: |
          git config user.name "p2p-bot"
          git config user.email "p2p-bot@users.noreply.github.com"
          git add model.pkl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Modelo sin cambios (o no se entrenó por falta de datos)."
            exit 0
          fi
          git commit -m "reentrenamiento $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git push && break
            git pull --rebase && sleep 3
          done
